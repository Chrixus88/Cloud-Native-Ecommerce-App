services:
  identity-service:
    build:
      context: ./identity-service
    container_name: identity-service
    ports:
      - "3001:3001"
    env_file:
      - ./identity-service/.env
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  product-service:
    build: 
      context: ./product-service
    container_name: product-service
    ports:
      - "3002:3002"
    env_file:
      - ./product-service/.env
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "3006:3006"
    env_file:
      - ./order-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-network
  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "3005:3005"
    env_file:
      - ./inventory-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-network
networks:
  ecommerce-network:
    driver: bridge
  