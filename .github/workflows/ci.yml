
name: Ecommerce Microservices CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      product: ${{ steps.filter.outputs.product }}
      identity: ${{ steps.filter.outputs.identity }}
      cart: ${{ steps.filter.outputs.cart }}
      inventory: ${{ steps.filter.outputs.inventory }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      gateway: ${{ steps.filter.outputs.gateway }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed microservices
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            product:
              - 'product-service/**'
            identity:
              - 'identity-service/**'
            cart:
              - 'cart-service/**'
            inventory:
              - 'inventory-service/**'
            order:
              - 'order-service/**'
            payment:
              - 'payment-service/**'
            gateway:
              - 'api-gateway/**'

  microservices-ci:
    name: CI - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product-service
            filter: product
            image: ecommerce-product-service

          - service: identity-service
            filter: identity
            image: ecommerce-identity-service

          - service: cart-service
            filter: cart
            image: ecommerce-cart-service

          - service: inventory-service
            filter: inventory
            image: ecommerce-inventory-service

          - service: order-service
            filter: order
            image: ecommerce-order-service

          - service: payment-service
            filter: payment
            image: ecommerce-payment-service

          - service: api-gateway
            filter: gateway
            image: ecommerce-api-gateway

    steps:
      - name: Check whether service should run
        id: service-check
        env:
          CHANGED: ${{ needs.changes.outputs[matrix.filter] }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.service-check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.service-check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan with Trivy
        if: steps.service-check.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.service }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Install dependencies
        if: steps.service-check.outputs.run == 'true'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build Docker image
        if: steps.service-check.outputs.run == 'true'
        run: |
          docker build \
            -t ${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}
